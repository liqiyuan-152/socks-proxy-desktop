name: Desktop packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            bundles: dmg
          - platform: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 desktop-file-utils appstream xvfb ripgrep
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: package-${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - name: Prepare pinned core on supported platform
        run: pnpm prepare:core
      - name: Static checks and frontend unit tests
        run: pnpm check
      - name: Rust unit, integration and documentation tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Real-core gate regression tests
        if: runner.os == 'Windows'
        run: node --test scripts/test-real-core-checks.mjs
      - name: Verify pinned core and run real-core tests
        if: runner.os == 'Windows'
        run: node scripts/test-real-core.mjs
        env:
          SING_BOX_TEST_BIN: ${{ github.workspace }}\src-tauri\resources\sing-box\windows-amd64\sing-box.exe
      - name: Build desktop installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify Linux metadata, installation and packaged startup
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux-packages.sh src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Stage packages, checksums and source revision
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          $bundleDir = "src-tauri/target/$env:PACKAGE_TARGET/release/bundle"
          $packages = @(Get-ChildItem $bundleDir -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dmg', '.AppImage', '.deb', '.rpm') })
          if ($packages.Count -eq 0) { throw "No installer found in $bundleDir" }
          New-Item -ItemType Directory -Path package-artifacts | Out-Null
          $packages | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination package-artifacts }
          Get-ChildItem package-artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content package-artifacts/SHA256SUMS.txt -Encoding utf8
          git rev-parse HEAD | Set-Content package-artifacts/SOURCE_REVISION.txt -Encoding utf8
          (Get-Content package.json -Raw | ConvertFrom-Json).version | Set-Content package-artifacts/VERSION.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: socks-proxy-${{ matrix.platform }}-${{ github.ref_name }}-${{ github.sha }}
          path: package-artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tag release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: socks-proxy-*-${{ github.ref_name }}-${{ github.sha }}
          path: downloaded-packages
      - name: Verify packages and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: node scripts/prepare-release.mjs downloaded-packages release-assets "$RELEASE_TAG" "$RELEASE_REVISION"
      - name: Create release, upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            cat > release-notes.md <<'NOTES'
          自动构建的内测版本，包含 Windows x64 中文 EXE、macOS Apple Silicon / Intel / Universal DMG，以及 Linux x64 AppImage / DEB / RPM。

          Windows 支持实际代理运行；macOS 和 Linux 仅支持界面及部分配置管理，不支持代理内核和系统代理接管。安装包未配置开发者签名及 macOS 公证，自动更新尚未启用。

          SHA256SUMS.txt 为安装包校验清单，SOURCE_REVISION.txt 为对应源码提交。变更详情见本 tag 的 CHANGELOG.md。

          Windows 包含 GPLv3 sing-box 1.14.1 及上游许可证。对应源码：https://github.com/SagerNet/sing-box/tree/1ac1a339cb1223e9c70eae14c44411c75033c02d
          源码归档：https://github.com/SagerNet/sing-box/archive/1ac1a339cb1223e9c70eae14c44411c75033c02d.tar.gz
          内核来源和校验记录见本 tag 的 scripts/sing-box-release-manifest.md。
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Socks Proxy $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
