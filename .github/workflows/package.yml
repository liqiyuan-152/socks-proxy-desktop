name: Desktop packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: package-${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - name: Prepare pinned core on supported platform
        run: pnpm prepare:core
      - name: Static checks and frontend unit tests
        run: pnpm check
      - name: Rust unit, integration and documentation tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Real-core gate regression tests
        if: runner.os == 'Windows'
        run: node --test scripts/test-real-core-checks.mjs
      - name: Verify pinned core and run real-core tests
        if: runner.os == 'Windows'
        run: node scripts/test-real-core.mjs
        env:
          SING_BOX_TEST_BIN: ${{ github.workspace }}\src-tauri\resources\sing-box\windows-amd64\sing-box.exe
      - name: Build desktop installer
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Stage packages, checksums and source revision
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          $bundleDir = "src-tauri/target/$env:PACKAGE_TARGET/release/bundle"
          $packages = @(Get-ChildItem $bundleDir -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dmg') })
          if ($packages.Count -eq 0) { throw "No installer found in $bundleDir" }
          New-Item -ItemType Directory -Path package-artifacts | Out-Null
          $packages | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination package-artifacts }
          Get-ChildItem package-artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content package-artifacts/SHA256SUMS.txt -Encoding utf8
          git rev-parse HEAD | Set-Content package-artifacts/SOURCE_REVISION.txt -Encoding utf8
          (Get-Content package.json -Raw | ConvertFrom-Json).version | Set-Content package-artifacts/VERSION.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: socks-proxy-${{ matrix.platform }}-${{ github.ref_name }}-${{ github.sha }}
          path: package-artifacts/
          if-no-files-found: error
          retention-days: 30
