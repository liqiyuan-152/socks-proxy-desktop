name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned Windows core
        run: pnpm prepare:core
      - name: Static checks and frontend unit tests
        run: pnpm check
      - name: Rust unit, integration, property and documentation tests (without real core)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Real-core gate regression tests
        run: node --test scripts/test-real-core-checks.mjs
      - name: Verify pinned core and run real-core tests
        run: node scripts/test-real-core.mjs
        env:
          SING_BOX_TEST_BIN: ${{ github.workspace }}\src-tauri\resources\sing-box\windows-amd64\sing-box.exe
      - name: Frontend build
        run: pnpm build
      - name: Desktop build
        run: pnpm tauri:build:check

  coverage:
    runs-on: windows-latest
    env:
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: pnpm install --frozen-lockfile
      - name: Frontend store coverage
        run: pnpm test:coverage
      - name: Rust unit and integration coverage
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --locked --lcov --output-path rust-coverage.lcov
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: architecture-coverage-windows
          path: |
            rust-coverage.lcov
            coverage/
          if-no-files-found: error
