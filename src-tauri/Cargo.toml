[package]
name = "socks-proxy"
version = "0.1.0"
description = "A desktop SOCKS proxy manager"
authors = ["Socks Proxy contributors"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.78.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "socks_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.119"
log = "=0.4.21"
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "=2.9.2"
tokio = { version = "=1.36.0", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
keyring = "=2.3.3"
rand = "=0.8.5"
thiserror = "=1.0.61"
uuid = { version = "=1.8.0", features = ["serde", "v4"] }
sha2 = "=0.10.8"
hex = "=0.4.3"
tempfile = "=3.10.1"
url = "=2.5.7"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tauri = { version = "=2.11.6", features = ["test"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }
